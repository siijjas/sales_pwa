    <meta name="theme-color" content="#F6F5F3" />

  </head>
  <body>
    <div id="app"></div>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem('sales-app-theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (dark) {
            document.documentElement.classList.add('dark');
            if (m) m.setAttribute('content', '#121415');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Disable PWA caching: unregister any existing service workers and avoid new registrations
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister().catch(() => {}));
        });
      }
    </script>
  </body>
</html>
